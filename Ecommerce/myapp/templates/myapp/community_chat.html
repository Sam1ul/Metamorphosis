{% extends "myapp/base.html" %}
{% load static %}
{% block title %}Community Chat{% endblock title %}

{% block body %}
<div class="container mt-5" style="min-height: 100vh;">
  
    <div class="card-header text-center fw-bold" style="color: rgb(0, 0, 0); font-family: aq;">
      <h3 class="p-1">Community Chat</h3>
    </div>

    <div id="chat-body" class="card-body" style="max-height: 75vh; overflow-y: auto;">
      <p class="text-center text-muted">Loading messages...</p>
    </div>

    <div class="card-footer fixed-bottom p-2 bg-light">
      <form id="chat-form" method="POST" enctype="multipart/form-data" class="d-flex align-items-center">
        {% csrf_token %}
        <input type="text" name="message" id="chat-message" class="form-control me-2"
               placeholder="Type a message..." style="border: 1px solid rgb(0, 0, 0);color: black;">
        <input type="file" name="image" id="chat-image" class="form-control me-2 bg-dark text-light"
               style="max-width: 250px; border: 1px solid rgb(0, 0, 0);">
        <button type="submit" class="btn s" style="background-color: rgb(0, 0, 0);color: rgb(255, 255, 255);" onmouseover="this.style.backgroundColor='red';"onmouseout="this.style.backgroundColor='chartreuse';">Send</button>
      </form>
    </div>
 
</div>



<script>
/* 🎨 Inject CSS dynamically */
const style = document.createElement('style');
style.innerHTML = `
  

  .message-bubble {
    background: rgba(0,0,0,0.6);
    color: white;
    max-width: 300px;
    backdrop-filter: blur(5px);
  }

  .username {
    font-size: 14px;
    color: #ffd369;
  }

  .timestamp {
    font-size: 10px;
    opacity: 0.7;
    text-align: right;
  }

  .fade-in {
    animation: fadeIn 0.3s ease-in;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }


  #chat-form input, #chat-form button {
    margin-top: 5px;
  }
`;
document.head.appendChild(style);


/* 🌄 Background */
const body = document.querySelector('body');
body.style.background="linear-gradient(45deg,white,wheat,white)";
//body.style.backgroundImage = "url('/static/myapp/images/M.png')";
//body.style.backgroundSize = "cover";
//body.style.backgroundPosition = "center";
//body.style.backgroundRepeat = "no-repeat";
//body.style.backgroundAttachment = "fixed";

const chatBody = document.getElementById('chat-body');
const chatForm = document.getElementById('chat-form');
const messageInput = document.getElementById('chat-message');
const imageInput = document.getElementById('chat-image');
const csrfToken = '{{ csrf_token }}';

let lastMessageCount = 0;

// 🔄 Fetch Messages
async function fetchMessages() {
  const res = await fetch("{% url 'get_messages' %}");
  const data = await res.json();

  if (data.messages.length !== lastMessageCount) {
    appendNewMessages(data.messages);
    lastMessageCount = data.messages.length;
  }
}

// ⚡ Append only new messages
function appendNewMessages(messages) {
  const existingMessages = chatBody.children.length;

  messages.slice(existingMessages).forEach(msg => {
    addMessage(msg);
  });

  scrollToBottom();
}

// 💬 Add message
function addMessage(msg) {
  const isOwn = msg.username === "{{ request.user.username }}";

  const messageHTML = `
    <div class="d-flex mb-3 ${isOwn ? 'justify-content-end' : 'justify-content-start'} fade-in">
      <div class="d-flex align-items-start ${isOwn ? 'flex-row-reverse' : ''}">
        <img src="${msg.profile_pic ? msg.profile_pic : '{% static "myapp/images/default_avatar.png" %}'}"
             class="rounded-circle border border-light me-2 ms-2"
             style="width: 45px; height: 45px;">
        <div class="p-2 rounded message-bubble">
          <strong class="username">${msg.username}</strong><br>
          ${msg.message ? `<span>${msg.message}</span><br>` : ''}
          ${msg.image ? `<img src="${msg.image}" class="img-fluid rounded mt-2" style="max-height:200px;">` : ''}
          <div class="timestamp">${msg.timestamp}</div>
        </div>
      </div>
    </div>`;

  chatBody.insertAdjacentHTML('beforeend', messageHTML);
}

// ⬇ Smooth scroll
function scrollToBottom() {
  chatBody.scrollTo({
    top: chatBody.scrollHeight,
    behavior: 'smooth'
  });
}

// 🔁 Auto refresh
setInterval(fetchMessages, 2000);
fetchMessages();

// 🚀 Send Message
chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const messageText = messageInput.value.trim();
  if (!messageText && !imageInput.files[0]) return;

  addMessage({
    username: "{{ request.user.username }}",
    message: messageText,
    image: imageInput.files[0] ? URL.createObjectURL(imageInput.files[0]) : null,
    timestamp: "Sending..."
  });

  scrollToBottom();

  const formData = new FormData();
  formData.append('message', messageText);
  if (imageInput.files[0]) formData.append('image', imageInput.files[0]);

  await fetch("{% url 'community_chat' %}", {
    method: 'POST',
    headers: { 'X-CSRFToken': csrfToken },
    body: formData
  });

  messageInput.value = '';
  imageInput.value = '';
});

// 📷 Image Preview
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    let preview = document.getElementById('preview-img');

    if (!preview) {
      preview = document.createElement('img');
      preview.id = 'preview-img';
      preview.style.maxHeight = '100px';
      preview.style.marginTop = '5px';
      chatForm.appendChild(preview);
    }

    preview.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// ⌨ Typing indicator
let typingTimeout;

messageInput.addEventListener('input', () => {
  clearTimeout(typingTimeout);

  let typingDiv = document.getElementById('typing-indicator');
  if (!typingDiv) {
    typingDiv = document.createElement('div');
    typingDiv.id = 'typing-indicator';
    typingDiv.style.color = 'black';
    typingDiv.innerText = 'Typing...';
    chatForm.appendChild(typingDiv);
  }

  typingTimeout = setTimeout(() => {
    typingDiv.remove();
  }, 1000);
});
</script>

{% endblock body %}
