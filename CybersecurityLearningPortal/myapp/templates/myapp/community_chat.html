{% extends "myapp/base.html" %}
{% load static %}
{% block title %}Community Chat{% endblock title %}

{% block body %}
<div class="container mt-5 pb-5" style="min-height:100vh; padding-bottom:110px;">

    <!-- Chat Card -->
    <div class="card shadow-lg border-0">

        <!-- Header -->
        <div class="card-header text-center" style="background:linear-gradient(to right, #ffffff, #ffee00,white); color:white;">
            <h3 class="mb-0" style="font-family: aq;">
                Community Chat
            </h3>
        </div>

        <!-- Messages -->
        <div id="chat-body"
             class="card-body"
             style="height:75vh;
                    overflow-y:auto;
                    scroll-behavior:smooth;
                    background:#f8f9fa;">

            <p class="text-center text-muted mt-3">
                Loading messages...
            </p>

        </div>

    </div>

</div>

<!-- Fixed Input Bar -->
<div class="fixed-bottom bg-white border-top shadow-lg">

    <div class="container py-2">

        <form id="chat-form"
              method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="row g-2 align-items-center">

                <!-- Message -->
                <div class="col">

                    <input
                        type="text"
                        id="chat-message"
                        name="message"
                        class="form-control"
                        placeholder="Type your message..."
                        autocomplete="off">

                </div>

                <!-- Image -->
                <div class="col-auto">

                    <input
                        type="file"
                        id="chat-image"
                        name="image"
                        class="form-control"
                        style="width:170px;">

                </div>

                <!-- Send -->
                <div class="col-auto">

                    <button
                        type="submit"
                        class="btn btn-dark px-4">

                        Send

                    </button>

                </div>

            </div>

            <!-- Preview -->
            <div class="mt-2">

                <img
                    id="preview-img"
                    class="rounded border"
                    style="display:none; max-height:120px;">

            </div>

        </form>

    </div>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const chatBody = document.getElementById("chat-body");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("chat-message");
    const imageInput = document.getElementById("chat-image");

    const csrfToken = document.querySelector(
        "[name=csrfmiddlewaretoken]"
    ).value;

    let lastMessageId = 0;
    let firstLoad = true;
    let shouldAutoScroll = false;

    // ---------------- Detect Scroll Position ----------------

    chatBody.addEventListener("scroll", function () {

        if (firstLoad) return;

        const distanceFromBottom =
            chatBody.scrollHeight -
            chatBody.scrollTop -
            chatBody.clientHeight;

        shouldAutoScroll = distanceFromBottom < 100;

    });

    // ---------------- Add Message ----------------

    function addMessage(msg) {

        if (document.getElementById("msg-" + msg.id))
            return;

        const isOwn = msg.username === "{{ request.user.username }}";

        const html = `
        <div id="msg-${msg.id}"
             class="d-flex mb-3 ${isOwn ? 'justify-content-end' : 'justify-content-start'} fade-in">

            <div class="d-flex align-items-start ${isOwn ? 'flex-row-reverse' : ''}">

                <img
                    src="${msg.profile_pic ? msg.profile_pic : '{% static "myapp/images/default_avatar.png" %}'}"
                    class="rounded-circle border me-2 ms-2"
                    style="width:45px;height:45px;object-fit:cover;">

                <div class="message-bubble rounded p-2">

                    <strong class="username">
                        ${msg.username}
                    </strong><br>

                    ${msg.message ? `<span>${msg.message}</span><br>` : ""}

                    ${
                        msg.image
                        ? `<img src="${msg.image}" class="img-fluid rounded mt-2 chat-image" style="max-height:200px;">`
                        : ""
                    }

                    <div class="timestamp mt-1">
                        ${msg.timestamp}
                    </div>

                </div>

            </div>

        </div>
        `;

        chatBody.insertAdjacentHTML("beforeend", html);

        lastMessageId = Math.max(lastMessageId, msg.id);

    }

    // ---------------- Fetch Messages ----------------

    async function fetchMessages() {

        try {

            const response = await fetch("{% url 'get_messages' %}");

            if (!response.ok)
                return;

            const data = await response.json();

            let added = false;

            data.messages.forEach(msg => {

                if (msg.id > lastMessageId) {

                    addMessage(msg);
                    added = true;

                }

            });

            // FIRST PAGE LOAD
            if (firstLoad) {

                setTimeout(() => {

                    chatBody.scrollTop = chatBody.scrollHeight;

                    firstLoad = false;
                    shouldAutoScroll = true;

                }, 300);

                return;

            }

            // Normal auto-scroll
            if (added && shouldAutoScroll) {

                setTimeout(() => {

                    chatBody.scrollTop = chatBody.scrollHeight;

                }, 50);

            }

        }
        catch (err) {

            console.error(err);

        }

    }

    // ---------------- Initial Load ----------------

    fetchMessages();

    setInterval(fetchMessages, 2000);

    // ---------------- Send Message ----------------

    chatForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        const message = messageInput.value.trim();

        if (!message && imageInput.files.length === 0)
            return;

        const formData = new FormData();

        formData.append("message", message);

        if (imageInput.files.length > 0) {

            formData.append(
                "image",
                imageInput.files[0]
            );

        }

        try {

            const response = await fetch("{% url 'community_chat' %}", {

                method: "POST",

                headers: {
                    "X-CSRFToken": csrfToken
                },

                body: formData

            });

            if (response.ok) {

                messageInput.value = "";
                imageInput.value = "";

                const preview = document.getElementById("preview-img");

                if (preview)
                    preview.style.display = "none";

                fetchMessages();

            }

        }
        catch (err) {

            console.error(err);

        }

    });

    // ---------------- Image Preview ----------------

    imageInput.addEventListener("change", function () {

        const file = imageInput.files[0];

        const preview = document.getElementById("preview-img");

        if (!file) {

            preview.style.display = "none";
            return;

        }

        const reader = new FileReader();

        reader.onload = function (e) {

            preview.src = e.target.result;
            preview.style.display = "block";

        };

        reader.readAsDataURL(file);

    });

});
</script>
{% endblock body %}
